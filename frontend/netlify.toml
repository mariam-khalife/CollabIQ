# Netlify build config for the CollabIQ frontend.
# In the Netlify UI, set the site's "Base directory" to `frontend` so this
# file and the commands below resolve correctly.

[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback: let React Router handle client-side routes instead of Netlify
# returning 404 on a hard refresh of e.g. /dashboard.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
