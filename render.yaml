# Render Blueprint for CollabIQ: the FastAPI backend and the static frontend.
# Create the database on Neon first, then set DATABASE_URL / LLM_API_KEY /
# FRONTEND_ORIGINS in the Render dashboard (they are marked sync:false below).
services:
  - type: web
    name: collabiq-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: >-
      pip install -r requirements.txt &&
      pip install -r ../database/requirements.txt &&
      (cd ../database && alembic upgrade head)
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Neon connection string, e.g.
      # postgresql+psycopg2://USER:PASSWORD@HOST/DB?sslmode=require
      - key: DATABASE_URL
        sync: false
      # JWT signing secret - Render generates a strong random value.
      - key: SECRET_KEY
        generateValue: true
      # Google Gemini API key.
      - key: LLM_API_KEY
        sync: false
      # Deployed frontend origin, e.g. https://collabiq-web.onrender.com
      # (comma-separated if there is more than one).
      - key: FRONTEND_ORIGINS
        sync: false

  # Static Vite + React SPA. Free on Render and served from its CDN.
  - type: web
    name: collabiq-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # Single-page app: serve index.html for any path so client-side routes
    # survive a refresh or a direct link.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Vite inlines this at build time, so the bundle talks to the deployed
      # backend instead of the localhost fallback in src/services/api.js.
      - key: VITE_API_BASE_URL
        sync: false
